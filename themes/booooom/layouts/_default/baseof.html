<!doctype html>
<html lang="{{ site.LanguageCode | default "zh-CN" }}">
<head>
  {{- partial "head.html" . }}
  {{- block "head" . }}{{ end }}
</head>
<body class="{{ block "bodyclass" . }}page{{ end }}">
  {{- block "top" . }}{{ partial "top.html" . }}{{ end }}
  {{- block "main" . }}{{ end }}
  {{- block "hintbar" . }}{{ partial "hintbar.html" . }}{{ end }}
  <div class="grain" aria-hidden="true"></div>
  {{- partial "scripts.html" . }}
  {{- block "scripts" . }}{{ end }}
</body>
</html>
