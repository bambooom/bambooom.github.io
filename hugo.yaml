baseURL: https://zhuzi.dev/
title: "Blah Blah Booooom"
languageCode: zh-CN
theme: ["booooom"]
# https://gohugo.io/templates/pagination/
pagination:
  pagerSize: 20
timeout: "90s"

enableRobotsTXT: true
enableGitInfo: true
buildDrafts: false
buildFuture: false
buildExpired: false

hasCJKLanguage: true

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home: ["HTML", "RSS", "JSON"]

outputFormats:
  RSS:
    mediatype: "application/rss"
    baseName: "feed" # make rss page url to be https://zhuzi.dev/feed.xml

taxonomies:
  category: categories

# not using tags

services:
  rss:
    limit: 20
  disqus:
    shortname: "bamboooom"

params:
  env: production
  title: "Blah Blah Booooom"
  description: "Personal Blog of Bamboo/Zhuzi/竹子"
  keywords: [Blog]
  author:
    name: bambooom
    email: zhuzi.mn#gmail.com
  DateFormat: "2006.01.02"
  ShowFullTextinRSS: true
  comments: true

  # STATUS window on home / about
  status:
    name: 竹子
    since: 2008
    location: 深圳
    state: 找回正轨中
    job: 菜鸡前端
    zodiac: ♍️ 越来越处女座
    mood: 社恐（线上话唠）
  # スキル bars on /about (0–100)
  skills:
    - { name: 前端, value: 45 }
    - { name: ACG, value: 82 }
    - { name: BL 漫, value: 90 }
    - { name: 追星, value: 30 }
    - { name: 游戏, value: 20 }
    - { name: 读书, value: 35, trend: "↑" }
  # NOW dialogue on home (first lines of /now are used if empty)
  now: ""

  # other comments provider
  giscus:
    repo: "bambooom/bambooom.github.io"
    repoId: "MDEwOlJlcG9zaXRvcnk0ODY1MTExOA=="
    category: "Announcements"
    categoryId: "DIC_kwDOJXw4Z84B_7QH"
  twikoo:
    envId: "https://zhuzi-dev-twikoo.netlify.app/.netlify/functions/twikoo"

  socialIcons:
    - name: GitHub
      url: "https://github.com/bambooom"
    - name: Mastodon
      url: "https://m.cmx.im/@zhuzi"
    - name: X
      url: "https://twitter.com/bo0omzi"
    - name: Instagram
      url: "https://www.instagram.com/milkymono/"
    - name: Telegram
      url: "https://t.me/bambooom"
    - name: Email
      url: "mailto:zhuzi.mn@gmail.com"
    - name: RSS
      url: "https://zhuzi.dev/feed.xml"

menu:
  main:
    - identifier: posts
      name: 記録
      url: /posts/
      weight: 5
    - identifier: categories
      name: コマンド
      url: /categories/
      weight: 10
    - identifier: about
      name: STATUS
      url: /about/
      weight: 20
    - identifier: now
      name: NOW
      url: /now/
      weight: 30

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
